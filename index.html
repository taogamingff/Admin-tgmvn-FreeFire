<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADMIN • QUẢN TRỊ SỰ KIỆN</title>
<style>
@font-face{
  font-family:"GFF-Latin-Bold";
  src:url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
      url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
  font-weight:700;font-style:normal;font-display:swap;
}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --line:rgba(255,255,255,.12);
  --gold:#ffd166;
  --gold2:#ffb347;
  --txt:#e9eefb;
  --muted:#8fa2c2;
  --danger:#ff5d5d;
}
html,body{min-height:100%}
body{
  font-family:"GFF-Latin-Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--txt);
  background-color:#0a0f1e;
  padding:clamp(12px,2.5vw,26px);
  padding-bottom:80px;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(10,20,40,.45) 0%, rgba(0,0,0,.8) 100%),
    url('https://cdn.wildflamestudio.com/common/web_event/official2.ff.garena.all/img/20228/b2b0012af7e3bfcdc90cd8744065e8ab.jpg');
  background-size:cover;background-position:center;background-repeat:no-repeat;
  z-index:-1;pointer-events:none;
}
#loginScreen, #adminPanel {
  visibility: hidden;opacity: 0;pointer-events: none;
  transition: opacity .4s ease, visibility 0s linear .4s, transform .4s cubic-bezier(.2,.9,.3,1);
}
#loginScreen.active, #adminPanel.active {
  visibility: visible;opacity: 1;pointer-events: auto;
  transition: opacity .4s ease, visibility 0s, transform .4s cubic-bezier(.2,.9,.3,1);
}
#adminPanel{transform: translateY(24px) scale(.97);max-width:1400px;margin:0 auto}
#adminPanel.active{transform:none}

/* ============ LOGIN ============ */
#loginScreen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:18px;z-index:1000;background:rgba(4,8,16,.75);
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
}
#loginScreen::before,#loginScreen::after{
  content:"";position:absolute;border-radius:50%;filter:blur(80px);
  pointer-events:none;z-index:0;opacity:0;transition:opacity .6s ease .2s;
}
#loginScreen.active::before,#loginScreen.active::after{opacity:1}
#loginScreen::before{
  width:min(45vw,520px);height:min(45vw,520px);
  background:radial-gradient(circle,rgba(255,179,71,.55),rgba(255,179,71,0) 70%);
  top:-12vw;left:-12vw;animation:orbA 14s ease-in-out infinite;
}
#loginScreen::after{
  width:min(55vw,650px);height:min(55vw,650px);
  background:radial-gradient(circle,rgba(90,130,255,.45),rgba(90,130,255,0) 70%);
  bottom:-18vw;right:-18vw;animation:orbB 18s ease-in-out infinite;
}
@keyframes orbA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,-4vw) scale(1.2)}}
@keyframes orbB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8vw,6vw) scale(1.15)}}
.login-box{
  position:relative;z-index:1;width:min(420px,100%);
  background:linear-gradient(160deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 100%);
  border:1px solid rgba(255,209,102,.3);border-radius:20px;padding:28px 26px 24px;
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  overflow:hidden;
  animation:loginIn .6s cubic-bezier(.2,.9,.3,1),loginGlow 4s ease-in-out .6s infinite alternate;
}
.login-box::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,209,102,.9),transparent);
  animation:shimmer 3s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{opacity:.4;transform:translateX(-30%)}50%{opacity:1;transform:translateX(30%)}}
@keyframes loginIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
@keyframes loginGlow{
  from{box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.05) inset,0 0 30px rgba(255,180,60,.18)}
  to{box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.05) inset,0 0 60px rgba(255,180,60,.42)}
}
.login-box.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{0%,100%{transform:translateX(0)}15%,55%{transform:translateX(-10px)}35%,75%{transform:translateX(10px)}}
.login-box.success{animation:successFlash .7s ease}
@keyframes successFlash{
  0%{box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 0 2px rgba(80,220,120,.9) inset,0 0 90px rgba(80,220,120,.9);border-color:rgba(80,220,120,.9)}
  100%{box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 0 1px rgba(80,220,120,0) inset,0 0 0 rgba(80,220,120,0);border-color:rgba(80,220,120,.3)}
}
.login-logo{text-align:center;margin-bottom:24px}
.login-logo h1{
  font-size:22px;letter-spacing:3px;font-weight:800;margin-bottom:6px;
  background:linear-gradient(135deg,#fff 0%,#ffe28a 45%,#ffb347 80%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 14px rgba(255,180,0,.4));
}
.login-logo p{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.login-field{margin-bottom:14px}
.login-field label{
  display:block;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;font-weight:700;
}
.login-field input{
  width:100%;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.5px;
  color:#fff;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:12px 14px;outline:none;
  transition:border-color .25s ease,box-shadow .25s ease,background .25s ease;
}
.login-field input:focus{
  border-color:rgba(255,209,102,.7);box-shadow:0 0 0 3px rgba(255,209,102,.14);background:rgba(0,0,0,.5);
}
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:46px}
.pwd-toggle{
  position:absolute;top:50%;right:6px;transform:translateY(-50%);
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:none;cursor:pointer;color:rgba(255,255,255,.6);
  border-radius:8px;transition:.22s ease;
}
.pwd-toggle:hover{color:var(--gold);background:rgba(255,209,102,.1)}
.pwd-toggle:active{transform:translateY(-50%) scale(.9)}
.pwd-toggle svg{width:18px;height:18px;display:block}
.login-btn{
  position:relative;overflow:hidden;width:100%;margin-top:6px;
  font-family:inherit;font-size:13.5px;font-weight:800;letter-spacing:2px;
  padding:14px;border-radius:12px;cursor:pointer;color:#241300;
  background:linear-gradient(135deg,#ffd166,#ffb347);border:none;
  box-shadow:0 8px 24px rgba(255,180,60,.35);
  transition:transform .22s ease,box-shadow .22s ease;
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(255,180,60,.55)}
.login-btn:active{transform:translateY(0) scale(.98)}
.login-btn::before{
  content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
  transition:left .7s cubic-bezier(.2,.9,.3,1);pointer-events:none;
}
.login-btn:hover::before{left:100%}
.login-btn .btn-text{position:relative;z-index:1;transition:opacity .2s ease}
.login-btn.loading{cursor:wait}
.login-btn.loading .btn-text{opacity:0}
.login-btn.loading::after{
  content:"";position:absolute;top:50%;left:50%;width:18px;height:18px;
  margin:-9px 0 0 -9px;border:2.5px solid rgba(36,19,0,.25);
  border-top-color:#241300;border-radius:50%;animation:spin .6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.login-error{
  margin-top:12px;font-size:12px;letter-spacing:.5px;color:#ff8b8b;
  text-align:center;min-height:16px;opacity:0;transform:translateY(-4px);
  transition:opacity .3s ease,transform .3s ease;
}
.login-error.show{opacity:1;transform:none}

/* ============ ADMIN ============ */
.top{
  display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:20px;
}
.top h1{
  font-size:clamp(18px,2.6vw,26px);letter-spacing:2px;font-weight:800;
  background:linear-gradient(135deg,#fff 0%,#ffe28a 45%,#ffb347 80%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 14px rgba(255,180,0,.4));
}
.sub{font-size:12.5px;color:var(--muted);letter-spacing:.6px;margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.6px;
  padding:10px 15px;border-radius:10px;cursor:pointer;color:var(--txt);
  background:rgba(255,255,255,.07);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:.2s ease;
}
.btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-gold{background:linear-gradient(135deg,#ffd166,#ffb347);color:#241300;border-color:transparent;box-shadow:0 6px 18px rgba(255,180,60,.32)}
.btn-gold:hover{box-shadow:0 10px 26px rgba(255,180,60,.48)}
.btn-danger{color:#ffb4b4;border-color:rgba(255,93,93,.4);background:rgba(255,93,93,.12)}
.btn-danger:hover{background:rgba(255,93,93,.22)}

.card{
  position:relative;
  background:linear-gradient(160deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 100%);
  border:1px solid rgba(255,209,102,.25);border-radius:16px;
  padding:16px 18px 18px;margin-bottom:14px;
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.04);
  animation:cardIn .3s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge{
  font-size:11px;font-weight:800;letter-spacing:1px;padding:6px 10px;border-radius:8px;
  color:#241300;background:linear-gradient(135deg,#ffd166,#ffb347);flex-shrink:0;
  box-shadow:0 3px 10px rgba(255,180,60,.3);
}
.name-input{
  flex:1;min-width:160px;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.6px;
  color:#fff;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;
  padding:10px 13px;outline:none;transition:.18s;
}
.name-input:focus{border-color:rgba(255,209,102,.65);box-shadow:0 0 0 3px rgba(255,209,102,.14)}
.acts{display:flex;gap:6px}
.mini{
  font-family:inherit;font-size:12px;font-weight:700;padding:8px 11px;border-radius:8px;
  cursor:pointer;color:var(--txt);background:rgba(255,255,255,.06);
  border:1px solid var(--line);transition:.18s;
}
.mini:hover{background:rgba(255,255,255,.14)}
.mini.del{color:#ffb4b4;border-color:rgba(255,93,93,.35);background:rgba(255,93,93,.12)}
.mini.del:hover{background:rgba(255,93,93,.24)}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.row{margin-bottom:14px}
.txt{
  width:100%;font-family:inherit;font-size:13px;color:#fff;
  background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;
  padding:10px 13px;outline:none;transition:.18s;
}
.txt:focus{border-color:rgba(255,209,102,.65);box-shadow:0 0 0 3px rgba(255,209,102,.14)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.input-row{display:flex;gap:8px}
.input-row .txt{flex:1;min-width:0}
.preview{
  margin-top:9px;height:100px;border-radius:10px;
  border:1px dashed rgba(255,255,255,.18);background:rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
}
.preview img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.preview:not(.has)::after{content:"Chưa có ảnh";font-size:11px;color:rgba(255,255,255,.3);letter-spacing:1px}
.preview:not(.has) img{display:none}
.banner-box{margin-top:10px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.banner-box summary{cursor:pointer;list-style:none;font-size:12px;font-weight:800;letter-spacing:1.4px;color:var(--gold);padding:6px 0;user-select:none}
.banner-box summary::-webkit-details-marker{display:none}
.banner-box summary::before{content:"▸";display:inline-block;margin-right:9px;transition:.2s}
.banner-box[open] summary::before{transform:rotate(90deg)}
.banner-box[open] summary{margin-bottom:12px}
.add-card{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:20px;border-radius:16px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:800;letter-spacing:1.5px;
  color:var(--gold);background:rgba(255,209,102,.06);
  border:2px dashed rgba(255,209,102,.4);transition:.22s;
}
.add-card:hover{background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.75);transform:translateY(-1px)}
.add-card .plus{font-size:22px;line-height:1}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
  padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;letter-spacing:.5px;
  background:rgba(20,26,44,.96);border:1px solid rgba(255,209,102,.5);
  color:#ffe28a;box-shadow:0 14px 40px rgba(0,0,0,.7);
  opacity:0;pointer-events:none;transition:.28s ease;z-index:9999;
  max-width:92vw;text-align:center;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{border-color:rgba(255,93,93,.6);color:#ffb4b4}
.toast.success{border-color:rgba(80,220,120,.6);color:#a8ffc4}

.modal{
  position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(0,0,0,.75);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  opacity:0;visibility:hidden;transition:.25s;
}
.modal.show{opacity:1;visibility:visible}
.modal-box{
  width:min(820px,100%);
  background:linear-gradient(160deg,rgba(20,28,48,.98),rgba(10,16,32,.98));
  border:1px solid rgba(255,209,102,.3);border-radius:16px;padding:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.04);
}
.modal-box h3{font-size:15px;letter-spacing:1.8px;color:var(--gold);margin-bottom:10px}
.modal-box p{font-size:12.5px;color:var(--muted);line-height:1.65;margin-bottom:14px}
.modal-box code{background:rgba(255,209,102,.15);color:#ffe28a;padding:2px 6px;border-radius:4px;font-size:11.5px}
#linkOut{
  width:100%;height:180px;resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;color:#cfe3ff;background:rgba(0,0,0,.5);
  border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;word-break:break-all;
}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.modal-status{
  padding:10px 14px;border-radius:10px;font-size:12.5px;letter-spacing:.5px;margin-bottom:12px;
  background:rgba(80,220,120,.1);border:1px solid rgba(80,220,120,.4);color:#a8ffc4;
}
.modal-status.error{background:rgba(255,93,93,.1);border-color:rgba(255,93,93,.4);color:#ffb4b4}
.modal-status.info{background:rgba(80,160,255,.1);border-color:rgba(80,160,255,.4);color:#a8d4ff}
@media(max-width:520px){
  .top{align-items:flex-start}
  .tools{width:100%}
  .btn{flex:1 1 auto;text-align:center}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo"><h1>QUẢN TRỊ VIÊN</h1><p>TGM VN • FREE FIRE</p></div>
    <div class="login-field">
      <label for="loginUser">Tài khoản</label>
      <input type="text" id="loginUser" placeholder="Nhập tài khoản" autocomplete="username" spellcheck="false">
    </div>
    <div class="login-field">
      <label for="loginPass">Mật khẩu</label>
      <div class="pwd-wrap">
        <input type="password" id="loginPass" placeholder="Nhập mật khẩu" autocomplete="current-password">
        <button type="button" class="pwd-toggle" id="togglePwd" aria-label="Hiện mật khẩu">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <button type="button" class="login-btn" id="loginBtn"><span class="btn-text">ĐĂNG NHẬP</span></button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<div id="adminPanel">
  <div class="top">
    <div>
      <h1>QUẢN TRỊ SỰ KIỆN</h1>
      <p class="sub" id="subDesc">Tự động thêm • 0 sự kiện</p>
    </div>
    <div class="tools">
      <button class="btn btn-gold" id="btnAdd">+ Tạo sự kiện</button>
      <button class="btn btn-gold" id="btnLink">🔗 Tạo Link User</button>
      <button class="btn" id="btnPreview">👁 Xem trước</button>
      <button class="btn btn-danger" id="btnReset">↺ Đặt lại</button>
      <button class="btn btn-danger" id="btnLogout">⎋ Đăng xuất</button>
    </div>
  </div>
  <main id="list"></main>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">LINK USER</h3>
    <div class="modal-status info" id="modalStatus" style="display:none"></div>
    <p id="modalDesc"></p>
    <textarea id="linkOut" readonly></textarea>
    <div class="modal-actions">
      <button class="btn btn-gold" id="copyLink">Sao chép tất cả</button>
      <button class="btn" id="openLink">Mở link event1</button>
      <button class="btn" id="closeModal">Đóng</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ============ AUTH ============ */
  var SESSION_KEY = 'tgmvn_admin_session_v1';
  function _d64(s){ try{ return atob(s); }catch(e){ return ''; } }
  var AUTH_USER = _d64('QXplcnN0IEZyZWUgRmlyZQ==');   // Azerst Free Fire
  var AUTH_PASS = _d64('QXplcnN0RnJlZUZpcmUxMjI=');    // AzerstFreeFire122

  var loginScreen = document.getElementById('loginScreen');
  var adminPanel  = document.getElementById('adminPanel');
  var loginBox    = document.querySelector('.login-box');
  var loginUser   = document.getElementById('loginUser');
  var loginPass   = document.getElementById('loginPass');
  var loginBtn    = document.getElementById('loginBtn');
  var loginError  = document.getElementById('loginError');
  var togglePwd   = document.getElementById('togglePwd');
  var eyeOpen     = togglePwd.querySelector('.eye-open');
  var eyeOff      = togglePwd.querySelector('.eye-off');

  var pwdVisible = false;
  togglePwd.addEventListener('click', function () {
    pwdVisible = !pwdVisible;
    loginPass.type = pwdVisible ? 'text' : 'password';
    eyeOpen.style.display = pwdVisible ? 'none' : '';
    eyeOff.style.display  = pwdVisible ? '' : 'none';
    togglePwd.setAttribute('aria-label', pwdVisible ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    loginPass.focus();
  });

  function showError(msg) {
    loginError.textContent = msg;
    loginError.classList.remove('show');
    void loginError.offsetHeight;
    loginError.classList.add('show');
  }
  function clearError() {
    loginError.classList.remove('show');
    loginError.textContent = '';
  }
  function showPanel() {
    loginScreen.classList.remove('active');
    adminPanel.classList.add('active');
    setTimeout(function () {
      if (window.__adminBoot) window.__adminBoot();
      toast('✓ Đăng nhập thành công', 'success');
    }, 120);
  }
  function showLogin() {
    adminPanel.classList.remove('active');
    loginScreen.classList.add('active');
    setTimeout(function () { loginUser.focus(); }, 450);
  }
  function tryLogin() {
    var u = (loginUser.value || '').trim();
    var p = loginPass.value || '';
    if (!u || !p) {
      showError('Vui lòng nhập đủ tài khoản và mật khẩu');
      loginBox.classList.add('shake');
      setTimeout(function () { loginBox.classList.remove('shake'); }, 520);
      return;
    }
    clearError();
    loginBtn.classList.add('loading');
    loginBtn.disabled = true;
    setTimeout(function () {
      loginBtn.classList.remove('loading');
      loginBtn.disabled = false;
      if (u === AUTH_USER && p === AUTH_PASS) {
        loginBox.classList.add('success');
        try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) {}
        setTimeout(function () { loginBox.classList.remove('success'); showPanel(); }, 550);
      } else {
        showError('Sai tài khoản hoặc mật khẩu');
        loginBox.classList.add('shake');
        setTimeout(function () { loginBox.classList.remove('shake'); }, 520);
        loginPass.value = '';
        setTimeout(function () { loginPass.focus(); }, 150);
      }
    }, 550);
  }
  loginBtn.addEventListener('click', tryLogin);
  loginPass.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryLogin(); });
  loginUser.addEventListener('keydown', function (e) { if (e.key === 'Enter') loginPass.focus(); });

  document.getElementById('btnLogout').addEventListener('click', function () {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    loginUser.value = ''; loginPass.value = '';
    pwdVisible = false; loginPass.type = 'password';
    eyeOpen.style.display = ''; eyeOff.style.display = 'none';
    clearError();
    showLogin();
  });

  /* ============ DATA ============ */
  var LS_KEY    = 'tgmvn_ff_admin_v1';
  var CLOUD_KEY = 'tgmvn_ff_cloud_v1';
  var CLOUD_API = 'https://jsonblob.com/api/jsonBlob';
  var USER_URL  = 'https://azerst-freefire.vercel.app/';

  var DEFAULT_STATE = {
    siteTitle: 'TAB SỰ KIỆN | Trang chủ',
    footer: '© Azerst 2026 – All rights reserved',
    events: [
      { id:'1', name:'Sự kiện 1', tag:'MÀN TRÌNH DIỄN KINH DỊ',
        logo:'https://azerst-image-vn.vercel.app/images/8F9d2wz2w.png',
        tab:'https://azerst-image-vn.vercel.app/images/wRZwa1Bqv.png',
        bg:'https://azerst-image-vn.vercel.app/images/orGmr7jOS.png',
        bannerLabel:'TÀ LINH ĐỔ BỘ',
        banners:{'16-9':'https://azerst-image-vn.vercel.app/images/eHDvjfDHK.jpg','portrait':'https://azerst-image-vn.vercel.app/images/z1R4FBio5.png','256':'https://azerst-image-vn.vercel.app/images/GQi503B4g.png','512':'https://azerst-image-vn.vercel.app/images/UlyJpvmBm.png'} },
      { id:'2', name:'Sự kiện 2', tag:'MÓNG VUỐT TAI HOẠ',
        logo:'https://azerst-image-vn.vercel.app/images/m4jwa7iMn.png',
        tab:'https://azerst-image-vn.vercel.app/images/Xl6yeAKFU.png',
        bg:'https://azerst-image-vn.vercel.app/images/QOoBqwG3R.png',
        bannerLabel:'MÀN TRÌNH DIỄN KINH DỊ',
        banners:{'16-9':'https://azerst-image-vn.vercel.app/images/64SsEq3sh.jpg','portrait':'https://azerst-image-vn.vercel.app/images/NkS5Uib75.png','256':'https://azerst-image-vn.vercel.app/images/4q4A1mvDU.png','512':'https://azerst-image-vn.vercel.app/images/dmbomVVfA.png'} },
      { id:'3', name:'Sự kiện 3', tag:'HÀNH ĐỘNG HALLOWEEN',
        logo:'https://azerst-image-vn.vercel.app/images/mw5xbjnMj.png',
        tab:'https://azerst-image-vn.vercel.app/images/GsqjGtxDt.png',
        bg:'https://azerst-image-vn.vercel.app/images/rGM5HmhEG.png',
        bannerLabel:'MÓNG VUỐT TAI HỌA',
        banners:{'16-9':'https://azerst-image-vn.vercel.app/images/hTbfK9XRk.png','portrait':'https://azerst-image-vn.vercel.app/images/MrGWGnY3e.png','256':'https://azerst-image-vn.vercel.app/images/9pWreeN5O.png','512':'https://azerst-image-vn.vercel.app/images/UUOllEYiO.png'} }
    ]
  };

  var list    = document.getElementById('list');
  var subDesc = document.getElementById('subDesc');
  var toastEl = document.getElementById('toast');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var toastTimer = null;
  function toast(msg, type) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast'; }, 2800);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); resolve(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  function normalize(d) {
    d = d || {};
    d.siteTitle = d.siteTitle || DEFAULT_STATE.siteTitle;
    d.footer    = d.footer    || DEFAULT_STATE.footer;
    d.events    = Array.isArray(d.events) ? d.events : [];
    d.events = d.events.map(function (ev, i) {
      ev = ev || {};
      return {
        id: ev.id || uid(),
        name: ev.name || ('Sự kiện ' + (i + 1)),
        tag: ev.tag || '', logo: ev.logo || '', tab: ev.tab || '', bg: ev.bg || '',
        bannerLabel: ev.bannerLabel || '',
        banners: {
          '16-9':(ev.banners && ev.banners['16-9'])||'',
          'portrait':(ev.banners && ev.banners['portrait'])||'',
          '256':(ev.banners && ev.banners['256'])||'',
          '512':(ev.banners && ev.banners['512'])||''
        }
      };
    });
    return d;
  }
  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.events)) return normalize(d);
      }
    } catch (e) {}
    return normalize(clone(DEFAULT_STATE));
  }
  var state = load();

  /* ============ CLOUD SYNC ============ */
  var syncState = 'idle'; // idle | pending | syncing | synced | error
  var syncTimer = null;
  var lastSync = null;

  function getCloud() {
    try { return JSON.parse(localStorage.getItem(CLOUD_KEY)) || null; } catch (e) { return null; }
  }
  function setCloud(info) {
    try { localStorage.setItem(CLOUD_KEY, JSON.stringify(info)); } catch (e) {}
  }

  function updateSyncLabel() {
    var statusText = '';
    if (syncState === 'syncing') statusText = ' • ⏳ Đang đồng bộ...';
    else if (syncState === 'synced') statusText = ' • ✓ Đã đồng bộ';
    else if (syncState === 'error') statusText = ' • ⚠ Lỗi đồng bộ';
    else if (syncState === 'pending') statusText = ' • • Chờ...';
    subDesc.textContent = 'Tự động thêm • ' + state.events.length + ' sự kiện' + statusText;
  }

  // Thử phục hồi Cloud ID cũ từ cloud.json của User (khi mất localStorage)
  function recoverCloudId() {
    return fetch(USER_URL + 'cloud.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { return d && d.id ? d.id : null; })
      .catch(function () { return null; });
  }

  function doSync() {
    return new Promise(function (resolve, reject) {
      var info = getCloud();
      var payload = JSON.stringify(state);
      syncState = 'syncing';
      updateSyncLabel();

      function send(id) {
        if (id) {
          return fetch(CLOUD_API + '/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: payload
          }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return { id: id, action: 'update' };
          });
        }
        return fetch(CLOUD_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          var loc = r.headers.get('Location') || r.headers.get('location');
          if (!loc) throw new Error('No Location header');
          return { id: loc.split('/').pop(), action: 'create' };
        });
      }

      var promise;
      if (info && info.id) {
        promise = send(info.id);
      } else {
        // Chưa có ID → thử recover từ cloud.json
        promise = recoverCloudId().then(function (recovered) {
          if (recovered) {
            setCloud({ id: recovered, at: Date.now() });
            return send(recovered);
          }
          return send(null);
        });
      }

      promise.then(function (res) {
        setCloud({ id: res.id, at: Date.now() });
        lastSync = res;
        syncState = 'synced';
        updateSyncLabel();
        resolve(res);
      }).catch(function (err) {
        syncState = 'error';
        updateSyncLabel();
        reject(err);
      });
    });
  }

  function scheduleSync() {
    syncState = 'pending';
    updateSyncLabel();
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      doSync().catch(function () {});
    }, 2000);
  }

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    scheduleSync();
  }

  /* ============ RENDER ============ */
  function urlField(field, label, value) {
    value = value || '';
    return '<div class="field">' +
      '<label class="lbl">' + esc(label) + '</label>' +
      '<div class="input-row">' +
        '<input class="txt url" data-field="' + esc(field) + '" value="' + esc(value) + '" placeholder="https://...">' +
        '<button type="button" class="mini" data-clear="' + esc(field) + '">Xóa</button>' +
      '</div>' +
      '<div class="preview' + (value ? ' has' : '') + '" data-preview="' + esc(field) + '">' +
        '<img src="' + esc(value) + '" alt="" onerror="this.removeAttribute(\'src\')">' +
      '</div></div>';
  }

  function cardHTML(ev, i) {
    return '<section class="card" data-id="' + esc(ev.id) + '">' +
      '<div class="card-head">' +
        '<span class="badge">#' + (i + 1) + '</span>' +
        '<input class="name-input" data-field="name" value="' + esc(ev.name) + '" placeholder="Tên sự kiện">' +
        '<div class="acts">' +
          '<button type="button" class="mini" data-act="up">↑</button>' +
          '<button type="button" class="mini" data-act="down">↓</button>' +
          '<button type="button" class="mini del" data-act="del">✕ Xóa</button>' +
        '</div></div>' +
      '<div class="row"><label class="lbl">Tag chữ đỏ</label>' +
        '<input class="txt" data-field="tag" value="' + esc(ev.tag) + '"></div>' +
      '<div class="grid">' +
        urlField('logo', 'TITLE SỰ KIỆN (logo)', ev.logo) +
        urlField('tab',  'TAB SỰ KIỆN', ev.tab) +
        urlField('bg',   'BACKGROUND SỰ KIỆN', ev.bg) +
      '</div>' +
      '<details class="banner-box">' +
        '<summary>BANNER SỰ KIỆN</summary>' +
        '<div class="row"><label class="lbl">Tiêu đề banner</label>' +
          '<input class="txt" data-field="bannerLabel" value="' + esc(ev.bannerLabel) + '"></div>' +
        '<div class="grid">' +
          urlField('banner.16-9',     'Banner 16:9',    ev.banners['16-9']) +
          urlField('banner.portrait', 'Banner 436×606', ev.banners['portrait']) +
          urlField('banner.256',      'Banner 256×107', ev.banners['256']) +
          urlField('banner.512',      'Banner 512×182', ev.banners['512']) +
        '</div>' +
      '</details></section>';
  }

  function render() {
    var html = '';
    state.events.forEach(function (ev, i) { html += cardHTML(ev, i); });
    html += '<button type="button" class="add-card" id="addCard"><span class="plus">+</span> TẠO DANH SÁCH SỰ KIỆN</button>';
    list.innerHTML = html;
    updateSyncLabel();
  }

  function setPreview(container, url) {
    if (!container) return;
    var img = container.querySelector('img');
    if (!img) return;
    if (url) { img.src = url; container.classList.add('has'); }
    else { img.removeAttribute('src'); container.classList.remove('has'); }
  }

  list.addEventListener('input', function (e) {
    var el = e.target, card = el.closest('.card');
    if (!card) return;
    var ev = state.events.find(function (x) { return x.id === card.dataset.id; });
    if (!ev) return;
    var f = el.dataset.field;
    if (!f) return;
    var v = el.value;
    if (f.indexOf('banner.') === 0) ev.banners[f.slice(7)] = v.trim();
    else ev[f] = v;
    if (el.classList.contains('url')) setPreview(card.querySelector('[data-preview="' + f + '"]'), v.trim());
    save();
  });

  list.addEventListener('click', function (e) {
    var clr = e.target.closest('[data-clear]');
    if (clr) {
      var card0 = clr.closest('.card');
      var input = card0.querySelector('[data-field="' + clr.dataset.clear + '"]');
      if (input) { input.value = ''; input.dispatchEvent(new Event('input', { bubbles: true })); }
      return;
    }
    if (e.target.closest('#addCard')) { addEvent(); return; }
    var act = e.target.closest('[data-act]');
    if (!act) return;
    var card = act.closest('.card');
    if (!card) return;
    var idx = state.events.findIndex(function (x) { return x.id === card.dataset.id; });
    if (idx < 0) return;
    var a = act.dataset.act;
    if (a === 'up' && idx > 0) {
      var t1 = state.events[idx - 1];
      state.events[idx - 1] = state.events[idx]; state.events[idx] = t1;
      save(); render();
    } else if (a === 'down' && idx < state.events.length - 1) {
      var t2 = state.events[idx + 1];
      state.events[idx + 1] = state.events[idx]; state.events[idx] = t2;
      save(); render();
    } else if (a === 'del') {
      if (state.events.length <= 1) { toast('Phải giữ lại ít nhất 1 sự kiện'); return; }
      if (!confirm('Xóa "' + (state.events[idx].name || ('Sự kiện ' + (idx + 1))) + '" ?')) return;
      state.events.splice(idx, 1);
      save(); render(); toast('Đã xóa sự kiện');
    }
  });

  function addEvent() {
    var n = state.events.length + 1;
    state.events.push({
      id: uid(), name: 'Sự kiện ' + n,
      tag: '', logo: '', tab: '', bg: '',
      bannerLabel: '',
      banners: { '16-9':'', 'portrait':'', '256':'', '512':'' }
    });
    save(); render();
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    toast('Đã thêm "Sự kiện ' + n + '"');
  }

  document.getElementById('btnAdd').addEventListener('click', addEvent);

  /* ============ MODAL ============ */
  var modal       = document.getElementById('modal');
  var modalTitle  = document.getElementById('modalTitle');
  var modalDesc   = document.getElementById('modalDesc');
  var modalStatus = document.getElementById('modalStatus');
  var linkOut     = document.getElementById('linkOut');

  function showModal(opts) {
    modalTitle.textContent = opts.title || 'THÔNG TIN';
    modalDesc.innerHTML = opts.desc || '';
    if (opts.status) {
      modalStatus.textContent = opts.status.text;
      modalStatus.className = 'modal-status ' + (opts.status.type || 'info');
      modalStatus.style.display = '';
    } else {
      modalStatus.style.display = 'none';
    }
    linkOut.value = opts.link || '';
    modal.classList.add('show');
  }

  function buildLinkList() {
    var lines = [];
    state.events.forEach(function (ev, i) {
      var n = i + 1;
      lines.push((ev.name || ('Sự kiện ' + n)) + ':');
      lines.push(USER_URL + '?d=event' + n);
      lines.push('');
    });
    return lines.join('\n').trim();
  }

  document.getElementById('btnLink').addEventListener('click', function () {
    toast('Đang đồng bộ...');
    doSync().then(function (res) {
      showModal({
        title: 'LINK USER',
        status: { text: '✓ Đồng bộ cloud thành công • Cloud ID: ' + res.id, type: 'info' },
        desc: 'Link đã sẵn sàng. Gửi từng link bên dưới cho User tương ứng.<br><br>' +
              '<b>Lần đầu cài đặt:</b> tạo file <code>cloud.json</code> trên repo User (azerst-freefire) với nội dung:<br>' +
              '<code>{"id":"' + res.id + '"}</code>',
        link: buildLinkList()
      });
      toast('✓ Đã tạo link', 'success');
    }).catch(function (err) {
      showModal({
        title: 'LINK USER (CHƯA SYNC)',
        status: { text: '⚠ Lỗi: ' + err.message, type: 'error' },
        desc: 'Chưa đồng bộ được lên cloud. User sẽ thấy dữ liệu mặc định cho tới khi đồng bộ thành công. Thử lại sau.',
        link: buildLinkList()
      });
      toast('✗ Lỗi đồng bộ: ' + err.message, 'error');
    });
  });

  document.getElementById('btnPreview').addEventListener('click', function () {
    window.open(USER_URL + '?d=event1&debug=1', '_blank');
  });

  document.getElementById('copyLink').addEventListener('click', function () {
    if (!linkOut.value) return;
    copyText(linkOut.value)
      .then(function () { toast('Đã copy tất cả link', 'success'); })
      .catch(function () { linkOut.select(); toast('Hãy nhấn Ctrl+C', 'error'); });
  });

  document.getElementById('openLink').addEventListener('click', function () {
    window.open(USER_URL + '?d=event1', '_blank');
  });

  document.getElementById('closeModal').addEventListener('click', function () {
    modal.classList.remove('show');
  });
  modal.addEventListener('click', function (e) {
    if (e.target === modal) modal.classList.remove('show');
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    if (!confirm('Đặt lại toàn bộ về dữ liệu mặc định?')) return;
    state = normalize(clone(DEFAULT_STATE));
    save(); render();
    toast('Đã đặt lại dữ liệu');
  });

  /* ============ BOOT ============ */
  var booted = false;
  window.__adminBoot = function () {
    if (booted) return;
    booted = true;
    render();
    // Đồng bộ lần đầu sau khi vào panel
    if (!getCloud() || !getCloud().id) {
      scheduleSync();
    }
  };

  var hasSession = false;
  try { hasSession = sessionStorage.getItem(SESSION_KEY) === '1'; } catch (e) {}
  if (hasSession) {
    loginScreen.classList.remove('active');
    adminPanel.classList.add('active');
    window.__adminBoot();
  } else {
    loginScreen.classList.add('active');
    adminPanel.classList.remove('active');
    setTimeout(function () { loginUser.focus(); }, 450);
  }
})();
</script>
