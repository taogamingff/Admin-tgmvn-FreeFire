<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADMIN • QUẢN TRỊ SỰ KIỆN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --line:rgba(255,255,255,.10);
  --gold:#ffd166;
  --gold2:#ffb347;
  --txt:#e9eefb;
  --muted:#8b96b4;
  --danger:#ff5d5d;
}
html,body{min-height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--txt);
  background:
    radial-gradient(900px 520px at 8% -12%,rgba(255,190,80,.14),transparent 60%),
    radial-gradient(900px 520px at 96% 4%,rgba(90,130,255,.15),transparent 60%),
    #070b16;
  background-attachment:fixed;
  padding:clamp(12px,2.5vw,26px);
  padding-bottom:60px;
}
/* ===== TOP ===== */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{
  font-size:clamp(18px,2.6vw,26px);letter-spacing:2px;font-weight:800;
  background:linear-gradient(135deg,#fff 0%,#ffe28a 45%,#ffb347 80%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 12px rgba(255,180,0,.35));
}
.sub{font-size:12.5px;color:var(--muted);letter-spacing:.6px;margin-top:5px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.6px;
  padding:9px 14px;border-radius:10px;cursor:pointer;
  color:var(--txt);background:rgba(255,255,255,.06);
  border:1px solid var(--line);transition:.2s ease;
}
.btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn-gold{background:linear-gradient(135deg,#ffd166,#ffb347);color:#241300;border-color:transparent;box-shadow:0 6px 18px rgba(255,180,60,.28)}
.btn-gold:hover{box-shadow:0 8px 24px rgba(255,180,60,.42)}
.btn-danger{color:#ffb4b4;border-color:rgba(255,93,93,.4);background:rgba(255,93,93,.1)}
.btn-danger:hover{background:rgba(255,93,93,.2)}
/* ===== CARD ===== */
.card{
  position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:16px;
  padding:14px 16px 16px;margin-bottom:14px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 12px 34px rgba(0,0,0,.35);
  animation:fade .25s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.badge{
  font-size:11px;font-weight:800;letter-spacing:1px;padding:5px 9px;border-radius:8px;
  color:#241300;background:linear-gradient(135deg,#ffd166,#ffb347);flex-shrink:0;
}
.name-input{
  flex:1;min-width:160px;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.5px;
  color:#fff;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;outline:none;transition:.18s;
}
.name-input:focus{border-color:rgba(255,209,102,.6);box-shadow:0 0 0 3px rgba(255,209,102,.12)}
.acts{display:flex;gap:6px}
.mini{
  font-family:inherit;font-size:12px;font-weight:700;padding:7px 10px;border-radius:8px;cursor:pointer;
  color:var(--txt);background:rgba(255,255,255,.06);border:1px solid var(--line);transition:.18s;
}
.mini:hover{background:rgba(255,255,255,.14)}
.mini.del{color:#ffb4b4;border-color:rgba(255,93,93,.35);background:rgba(255,93,93,.1)}
.mini.del:hover{background:rgba(255,93,93,.22)}
/* ===== FIELD ===== */
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{margin-bottom:12px}
.txt{
  width:100%;font-family:inherit;font-size:13px;color:#fff;
  background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;outline:none;transition:.18s;
}
.txt:focus{border-color:rgba(255,209,102,.6);box-shadow:0 0 0 3px rgba(255,209,102,.12)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.input-row{display:flex;gap:8px}
.input-row .txt{flex:1;min-width:0}
.preview{
  margin-top:8px;height:96px;border-radius:10px;
  border:1px dashed rgba(255,255,255,.16);
  background:rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.preview img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.preview:not(.has)::after{content:"Chưa có ảnh";font-size:11px;color:rgba(255,255,255,.3);letter-spacing:1px}
.preview:not(.has) img{display:none}
/* ===== BANNER BOX ===== */
.banner-box{margin-top:8px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
.banner-box summary{
  cursor:pointer;list-style:none;font-size:12px;font-weight:800;letter-spacing:1.4px;
  color:var(--gold);padding:6px 0;user-select:none;
}
.banner-box summary::-webkit-details-marker{display:none}
.banner-box summary::before{content:"▸";display:inline-block;margin-right:8px;transition:.2s}
.banner-box[open] summary::before{transform:rotate(90deg)}
.banner-box[open] summary{margin-bottom:10px}
/* ===== ADD CARD ===== */
.add-card{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:18px;border-radius:16px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:800;letter-spacing:1.5px;
  color:var(--gold);background:rgba(255,209,102,.06);
  border:2px dashed rgba(255,209,102,.35);transition:.22s;
}
.add-card:hover{background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.7);transform:translateY(-1px)}
.add-card .plus{font-size:22px;line-height:1}
/* ===== TOAST ===== */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
  padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;letter-spacing:.5px;
  background:rgba(20,26,44,.96);border:1px solid rgba(255,209,102,.45);
  color:#ffe28a;box-shadow:0 14px 40px rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:.28s ease;z-index:9999;max-width:92vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ===== MODAL ===== */
.modal{
  position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;transition:.25s;
}
.modal.show{opacity:1;visibility:visible}
.modal-box{
  width:min(760px,100%);background:#0e1424;border:1px solid var(--line);border-radius:16px;
  padding:20px;box-shadow:0 30px 70px rgba(0,0,0,.7);
}
.modal-box h3{font-size:15px;letter-spacing:1.5px;color:var(--gold);margin-bottom:8px}
.modal-box p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:12px}
#linkOut{
  width:100%;height:130px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;color:#cfe3ff;background:rgba(0,0,0,.4);
  border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;word-break:break-all;
}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
@media(max-width:520px){
  .top{align-items:flex-start}
  .tools{width:100%}
  .btn{flex:1 1 auto;text-align:center}
}
</style>
</head>
<body>

<div class="top">
  <div>
    <h1>QUẢN TRỊ SỰ KIỆN</h1>
    <p class="sub" id="subDesc">Tự động thêm • 0 sự kiện</p>
  </div>
  <div class="tools">
    <button class="btn btn-gold" id="btnAdd">+ Tạo sự kiện</button>
    <button class="btn" id="btnLink">🔗 Tạo Link User</button>
    <button class="btn" id="btnCopy">📋 Copy JSON</button>
    <button class="btn" id="btnExport">⬇ Xuất data.json</button>
    <button class="btn" id="btnImport">⬆ Nhập JSON</button>
    <button class="btn" id="btnPreview">👁 Xem trước</button>
    <button class="btn btn-danger" id="btnReset">↺ Đặt lại</button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </div>
</div>

<main id="list"></main>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3>TẠO LINK USER</h3>
    <p>Dữ liệu được nhúng trực tiếp trong link. Gửi link này cho người dùng để họ thấy đúng nội dung bạn đã tạo.</p>
    <textarea id="linkOut" readonly></textarea>
    <div class="modal-actions">
      <button class="btn btn-gold" id="copyLink">Sao chép</button>
      <button class="btn" id="openLink">Mở link</button>
      <button class="btn" id="closeModal">Đóng</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var LS_KEY   = 'tgmvn_ff_admin_v1';
  var USER_URL = 'https://azerst-freefire.vercel.app/';

  /* ================= DỮ LIỆU MẶC ĐỊNH ================= */
  var DEFAULT_STATE = {
    siteTitle: 'TAB SỰ KIỆN | Trang chủ',
    footer: '© Azerst 2026 – All rights reserved',
    events: [
      {
        id: '1', name: 'Sự kiện 1',
        tag: 'MÀN TRÌNH DIỄN KINH DỊ',
        logo: 'https://azerst-image-vn.vercel.app/images/8F9d2wz2w.png',
        tab:  'https://azerst-image-vn.vercel.app/images/wRZwa1Bqv.png',
        bg:   'https://azerst-image-vn.vercel.app/images/orGmr7jOS.png',
        bannerLabel: 'TÀ LINH ĐỔ BỘ',
        banners: {
          '16-9':     'https://azerst-image-vn.vercel.app/images/eHDvjfDHK.jpg',
          'portrait': 'https://azerst-image-vn.vercel.app/images/z1R4FBio5.png',
          '256':      'https://azerst-image-vn.vercel.app/images/GQi503B4g.png',
          '512':      'https://azerst-image-vn.vercel.app/images/UlyJpvmBm.png'
        }
      },
      {
        id: '2', name: 'Sự kiện 2',
        tag: 'MÓNG VUỐT TAI HOẠ',
        logo: 'https://azerst-image-vn.vercel.app/images/m4jwa7iMn.png',
        tab:  'https://azerst-image-vn.vercel.app/images/Xl6yeAKFU.png',
        bg:   'https://azerst-image-vn.vercel.app/images/QOoBqwG3R.png',
        bannerLabel: 'MÀN TRÌNH DIỄN KINH DỊ',
        banners: {
          '16-9':     'https://azerst-image-vn.vercel.app/images/64SsEq3sh.jpg',
          'portrait': 'https://azerst-image-vn.vercel.app/images/NkS5Uib75.png',
          '256':      'https://azerst-image-vn.vercel.app/images/4q4A1mvDU.png',
          '512':      'https://azerst-image-vn.vercel.app/images/dmbomVVfA.png'
        }
      },
      {
        id: '3', name: 'Sự kiện 3',
        tag: 'HÀNH ĐỘNG HALLOWEEN',
        logo: 'https://azerst-image-vn.vercel.app/images/mw5xbjnMj.png',
        tab:  'https://azerst-image-vn.vercel.app/images/GsqjGtxDt.png',
        bg:   'https://azerst-image-vn.vercel.app/images/rGM5HmhEG.png',
        bannerLabel: 'MÓNG VUỐT TAI HỌA',
        banners: {
          '16-9':     'https://azerst-image-vn.vercel.app/images/hTbfK9XRk.png',
          'portrait': 'https://azerst-image-vn.vercel.app/images/MrGWGnY3e.png',
          '256':      'https://azerst-image-vn.vercel.app/images/9pWreeN5O.png',
          '512':      'https://azerst-image-vn.vercel.app/images/UUOllEYiO.png'
        }
      }
    ]
  };

  /* ================= HELPERS ================= */
  var list    = document.getElementById('list');
  var subDesc = document.getElementById('subDesc');
  var toastEl = document.getElementById('toast');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function b64urlEncode(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); resolve(); }
      catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  /* ================= STATE ================= */
  function normalize(d) {
    d = d || {};
    d.siteTitle = d.siteTitle || DEFAULT_STATE.siteTitle;
    d.footer    = d.footer    || DEFAULT_STATE.footer;
    d.events    = Array.isArray(d.events) ? d.events : [];
    d.events = d.events.map(function (ev, i) {
      ev = ev || {};
      return {
        id:          ev.id || uid(),
        name:        ev.name || ('Sự kiện ' + (i + 1)),
        tag:         ev.tag || '',
        logo:        ev.logo || '',
        tab:         ev.tab || '',
        bg:          ev.bg || '',
        bannerLabel: ev.bannerLabel || '',
        banners: {
          '16-9':     (ev.banners && ev.banners['16-9'])     || '',
          'portrait': (ev.banners && ev.banners['portrait']) || '',
          '256':      (ev.banners && ev.banners['256'])      || '',
          '512':      (ev.banners && ev.banners['512'])      || ''
        }
      };
    });
    return d;
  }

  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.events)) return normalize(d);
      }
    } catch (e) {}
    return normalize(clone(DEFAULT_STATE));
  }

  var state = load();

  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    }, 180);
  }

  /* ================= RENDER ================= */
  function urlField(field, label, value) {
    value = value || '';
    return '' +
      '<div class="field">' +
        '<label class="lbl">' + esc(label) + '</label>' +
        '<div class="input-row">' +
          '<input class="txt url" data-field="' + esc(field) + '" value="' + esc(value) + '" placeholder="https://...">' +
          '<button type="button" class="mini" data-clear="' + esc(field) + '">Xóa</button>' +
        '</div>' +
        '<div class="preview' + (value ? ' has' : '') + '" data-preview="' + esc(field) + '">' +
          '<img src="' + esc(value) + '" alt="" onerror="this.removeAttribute(\'src\')">' +
        '</div>' +
      '</div>';
  }

  function cardHTML(ev, i) {
    return '' +
    '<section class="card" data-id="' + esc(ev.id) + '">' +
      '<div class="card-head">' +
        '<span class="badge">#' + (i + 1) + '</span>' +
        '<input class="name-input" data-field="name" value="' + esc(ev.name) + '" placeholder="Tên sự kiện (hiện trên nút)">' +
        '<div class="acts">' +
          '<button type="button" class="mini" data-act="up" title="Lên">↑</button>' +
          '<button type="button" class="mini" data-act="down" title="Xuống">↓</button>' +
          '<button type="button" class="mini del" data-act="del" title="Xóa">✕ Xóa</button>' +
        '</div>' +
      '</div>' +

      '<div class="row">' +
        '<label class="lbl">Tag chữ đỏ (hiển thị phía trên)</label>' +
        '<input class="txt" data-field="tag" value="' + esc(ev.tag) + '" placeholder="VD: MÀN TRÌNH DIỄN KINH DỊ">' +
      '</div>' +

      '<div class="grid">' +
        urlField('logo', 'TITLE SỰ KIỆN (logo)', ev.logo) +
        urlField('tab',  'TAB SỰ KIỆN', ev.tab) +
        urlField('bg',   'BACKGROUND SỰ KIỆN', ev.bg) +
      '</div>' +

      '<details class="banner-box">' +
        '<summary>BANNER SỰ KIỆN (trang BANNER)</summary>' +
        '<div class="row">' +
          '<label class="lbl">Tiêu đề banner</label>' +
          '<input class="txt" data-field="bannerLabel" value="' + esc(ev.bannerLabel) + '" placeholder="VD: TÀ LINH ĐỔ BỘ">' +
        '</div>' +
        '<div class="grid">' +
          urlField('banner.16-9',     'Banner 16:9',     ev.banners['16-9']) +
          urlField('banner.portrait', 'Banner 436×606',  ev.banners['portrait']) +
          urlField('banner.256',      'Banner 256×107',  ev.banners['256']) +
          urlField('banner.512',      'Banner 512×182',  ev.banners['512']) +
        '</div>' +
      '</details>' +
    '</section>';
  }

  function render() {
    var html = '';
    state.events.forEach(function (ev, i) { html += cardHTML(ev, i); });
    html += '<button type="button" class="add-card" id="addCard"><span class="plus">+</span> TẠO DANH SÁCH SỰ KIỆN</button>';
    list.innerHTML = html;
    updateDesc();
  }

  function updateDesc() {
    subDesc.textContent = 'Tự động thêm • ' + state.events.length + ' sự kiện • Lưu tự động';
  }

  /* ================= PREVIEW ================= */
  function setPreview(container, url) {
    if (!container) return;
    var img = container.querySelector('img');
    if (!img) return;
    if (url) {
      img.src = url;
      container.classList.add('has');
    } else {
      img.removeAttribute('src');
      container.classList.remove('has');
    }
  }

  /* ================= EVENT DELEGATION ================= */
  list.addEventListener('input', function (e) {
    var el = e.target;
    var card = el.closest('.card');
    if (!card) return;
    var ev = state.events.find(function (x) { return x.id === card.dataset.id; });
    if (!ev) return;
    var f = el.dataset.field;
    if (!f) return;
    var v = el.value;

    if (f.indexOf('banner.') === 0) {
      ev.banners[f.slice(7)] = v.trim();
    } else {
      ev[f] = v;
    }

    if (el.classList.contains('url')) {
      setPreview(card.querySelector('[data-preview="' + f + '"]'), v.trim());
    }
    save();
  });

  list.addEventListener('click', function (e) {
    /* Xóa link ảnh */
    var clr = e.target.closest('[data-clear]');
    if (clr) {
      var card0 = clr.closest('.card');
      var input = card0.querySelector('[data-field="' + clr.dataset.clear + '"]');
      if (input) {
        input.value = '';
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      return;
    }

    /* Nút thêm sự kiện */
    if (e.target.closest('#addCard')) { addEvent(); return; }

    /* Hành động */
    var act = e.target.closest('[data-act]');
    if (!act) return;
    var card = act.closest('.card');
    if (!card) return;
    var idx = state.events.findIndex(function (x) { return x.id === card.dataset.id; });
    if (idx < 0) return;

    var a = act.dataset.act;
    if (a === 'up' && idx > 0) {
      var t1 = state.events[idx - 1];
      state.events[idx - 1] = state.events[idx];
      state.events[idx] = t1;
      save(); render();
    } else if (a === 'down' && idx < state.events.length - 1) {
      var t2 = state.events[idx + 1];
      state.events[idx + 1] = state.events[idx];
      state.events[idx] = t2;
      save(); render();
    } else if (a === 'del') {
      if (state.events.length <= 1) { toast('Phải giữ lại ít nhất 1 sự kiện'); return; }
      if (!confirm('Xóa "' + (state.events[idx].name || ('Sự kiện ' + (idx + 1))) + '" ?')) return;
      state.events.splice(idx, 1);
      save(); render(); toast('Đã xóa sự kiện');
    }
  });

  function addEvent() {
    var n = state.events.length + 1;
    state.events.push({
      id: uid(),
      name: 'Sự kiện ' + n,
      tag: '',
      logo: '', tab: '', bg: '',
      bannerLabel: '',
      banners: { '16-9': '', 'portrait': '', '256': '', '512': '' }
    });
    save(); render();
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    toast('Đã thêm "Sự kiện ' + n + '"');
  }

  /* ================= TOOLBAR ================= */
  document.getElementById('btnAdd').addEventListener('click', addEvent);

  document.getElementById('btnCopy').addEventListener('click', function () {
    copyText(JSON.stringify(state, null, 2))
      .then(function () { toast('Đã copy JSON'); })
      .catch(function () { toast('Không copy được, hãy dùng Xuất data.json'); });
  });

  document.getElementById('btnExport').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1200);
    toast('Đã xuất data.json — đưa file này vào repo User');
  });

  var fileInput = document.getElementById('fileInput');
  document.getElementById('btnImport').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        if (!d || !Array.isArray(d.events)) throw new Error('bad');
        state = normalize(d);
        save(); render();
        toast('Đã nhập ' + state.events.length + ' sự kiện');
      } catch (err) {
        toast('File JSON không hợp lệ');
      }
    };
    reader.readAsText(f);
    fileInput.value = '';
  });

  /* ===== LINK USER ===== */
  var modal   = document.getElementById('modal');
  var linkOut = document.getElementById('linkOut');

  function buildLink() {
    return USER_URL + '#d=' + b64urlEncode(JSON.stringify(state));
  }

  document.getElementById('btnLink').addEventListener('click', function () {
    linkOut.value = buildLink();
    modal.classList.add('show');
    if (linkOut.value.length > 60000) toast('Link rất dài, nên dùng data.json');
  });

  document.getElementById('btnPreview').addEventListener('click', function () {
    window.open(buildLink(), '_blank');
  });

  document.getElementById('copyLink').addEventListener('click', function () {
    copyText(linkOut.value)
      .then(function () { toast('Đã copy link User'); })
      .catch(function () { linkOut.select(); toast('Hãy nhấn Ctrl+C để copy'); });
  });

  document.getElementById('openLink').addEventListener('click', function () {
    if (linkOut.value) window.open(linkOut.value, '_blank');
  });

  document.getElementById('closeModal').addEventListener('click', function () {
    modal.classList.remove('show');
  });
  modal.addEventListener('click', function (e) {
    if (e.target === modal) modal.classList.remove('show');
  });

  /* ===== RESET ===== */
  document.getElementById('btnReset').addEventListener('click', function () {
    if (!confirm('Đặt lại toàn bộ về dữ liệu mặc định?')) return;
    state = normalize(clone(DEFAULT_STATE));
    save(); render();
    toast('Đã đặt lại dữ liệu');
  });

  /* ================= START ================= */
  render();
})();
</script>
</body>
</html>
